<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nuestro Tiempo · QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --lilac:#b58cc7; --lilac-deep:#855aa9; --ink:#453a58; --ink-soft:#8c7ba2;
    --rose:#d874ab; --gold:#c8a86a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:radial-gradient(140% 120% at 15% 0%,#f7efff 0%,#ece0fb 34%,#efdff4 60%,#e6e4ff 100%);
    display:flex;align-items:center;justify-content:center;
    padding:28px 18px;
  }

  .poster{
    position:relative;
    width:min(92vw,400px);
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:34px 26px 30px;
    border-radius:34px;
    background:rgba(255,255,255,.6);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 34px 80px -28px rgba(120,60,140,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }

  .kicker{
    font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);
  }

  .title{
    margin-top:10px;
    font-family:'Playfair Display','Cormorant Garamond',serif;
    font-weight:500;font-style:italic;
    font-size:clamp(2.1rem,9vw,2.7rem);line-height:1.1;color:var(--lilac-deep);
    letter-spacing:.005em;
  }
  .tagline{
    margin-top:6px;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:1rem;color:var(--ink-soft);
  }

  .qr-frame{
    position:relative;
    margin-top:26px;
    padding:20px;
    background:#fff;
    border-radius:26px;
    box-shadow:0 18px 38px -18px rgba(120,80,160,.55);
  }
  .qr-frame::before{
    content:"";position:absolute;inset:9px;border-radius:18px;
    border:1.5px solid rgba(181,140,199,.35);pointer-events:none;
  }
  .qr-frame svg{display:block;width:min(66vw,244px);height:auto}

  .divider{
    margin:22px auto 0;display:flex;align-items:center;gap:10px;color:var(--gold);
  }
  .divider span{height:1px;width:44px;background:linear-gradient(90deg,transparent,var(--gold))}
  .divider span:last-child{transform:scaleX(-1)}
  .divider svg{width:14px;height:14px;fill:currentColor}
</style>
</head>

  <div class="poster">
    <p class="kicker">escanéame</p>
    <h1 class="title">Nuestro Tiempo</h1>
    <p class="tagline">para ti</p>
