<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QR · Un Juntos Por Siempre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Cormorant+Garamond:wght@600&family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --lilac:#b58cc7; --lilac-deep:#855aa9; --ink:#453a58; --ink-soft:#8c7ba2;
    --rose:#d874ab; --gold:#c8a86a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:radial-gradient(140% 120% at 15% 0%,#f7efff 0%,#ece0fb 34%,#efdff4 60%,#e6e4ff 100%);
    display:flex;align-items:center;justify-content:center;
    padding:28px 18px;
  }

  .poster{
    width:min(92vw,400px);
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:30px 26px 26px;
    border-radius:32px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 30px 70px -25px rgba(120,60,140,.45);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }

  .kicker{
    font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);
  }
  .title{
    margin-top:6px;
    font-family:'Great Vibes',cursive;
    font-size:clamp(2.4rem,11vw,3rem);line-height:1.05;color:var(--lilac-deep);
  }
  .tagline{
    margin-top:2px;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:1rem;color:var(--ink-soft);
  }

  .qr-frame{
    margin-top:22px;
    padding:18px;
    background:#fff;
    border-radius:24px;
    box-shadow:0 16px 34px -18px rgba(120,80,160,.5);
  }
  .qr-frame svg{
    display:block;
    width:min(70vw,258px);height:auto;
  }

  .scan{
    margin-top:20px;
    display:flex;align-items:center;gap:8px;
    font-family:'Baloo 2','Poppins',sans-serif;font-weight:600;
    font-size:1.05rem;color:var(--rose);
  }
  .heart{width:20px;height:20px;fill:var(--rose)}

  .names{
    margin-top:14px;
    font-family:'Cormorant Garamond',serif;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;font-size:.95rem;color:var(--lilac-deep);
  }
  .url{
    margin-top:8px;
    font-size:.72rem;letter-spacing:.02em;color:var(--ink-soft);word-break:break-all;
  }
</style>
</head>
<body>
  <div class="poster">
    <p class="kicker">escanéame</p>
    <h1 class="title">Un Juntos Por Siempre</h1>
