<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview · Nuestro tiempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ===== Vista previa estática (números de ejemplo). El sitio real usa React. ===== */
:root{
  --lilac:#b58cc7; --lilac-deep:#855aa9; --lilac-soft:#e7d7f6;
  --ink:#453a58; --ink-soft:#8c7ba2; --rose:#d874ab; --rose-deep:#b4468b;
  --gold:#c8a86a; --cream:rgba(251,248,255,.72); --cream-brd:rgba(255,255,255,.9);
  --tint:rgba(244,236,252,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Poppins',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(140% 130% at 12% 0%,#f7efff 0%,#ece0fb 32%,#efdff4 58%,#e6e4ff 100%);
  display:flex;align-items:center;justify-content:center;padding:32px 18px;overflow-x:hidden;
}
.petals{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.petal{position:absolute;top:-6%;color:var(--lilac);fill:currentColor;opacity:.5;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%,90%{opacity:.5}100%{transform:translateY(112vh) rotate(220deg);opacity:0}}
.p0{left:8%;animation-duration:13s}.p1{left:22%;animation-duration:17s;animation-delay:-3s;color:#d29ad8}
.p2{left:37%;animation-duration:11s;animation-delay:-7s;color:#e0a8d0}.p3{left:52%;animation-duration:19s;animation-delay:-1s;color:#b79ae0}
.p4{left:66%;animation-duration:14s;animation-delay:-9s}.p5{left:79%;animation-duration:16s;animation-delay:-4s;color:#e0a8d0}
.p6{left:92%;animation-duration:12s;animation-delay:-11s;color:#b79ae0}
.card{
  position:relative;z-index:1;width:100%;max-width:430px;text-align:center;padding:34px 26px 30px;
  border-radius:30px;background:var(--cream);border:1px solid var(--cream-brd);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 26px 60px -24px rgba(120,80,160,.42);
}
.kicker{display:flex;align-items:center;justify-content:center;gap:9px;font-size:.72rem;letter-spacing:.34em;color:var(--gold)}
.kicker svg{fill:currentColor;opacity:.7}
.title{margin-top:10px;font-family:'Great Vibes',cursive;font-size:clamp(2.3rem,10.5vw,3.1rem);line-height:1.05;color:var(--lilac-deep)}
.tagline{margin-top:4px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:var(--ink-soft)}
.hero{margin:34px 0 6px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,3.5vw,20px)}
.hero-cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 8px 16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.7),var(--tint));border:1px solid rgba(255,255,255,.8);box-shadow:0 16px 34px -20px rgba(120,80,160,.45)}
.hero-ico{color:var(--lilac);opacity:.9}
.hero-num{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.9rem,16vw,3.9rem);line-height:.95;color:var(--ink)}
.hero-lbl{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
.hero-heart{position:relative;display:grid;place-items:center;width:clamp(78px,24vw,100px);height:clamp(78px,24vw,100px)}
.hh-icon{position:relative;z-index:1;color:var(--rose);fill:var(--rose);filter:drop-shadow(0 10px 20px rgba(216,116,171,.55));animation:beat 1.5s ease-in-out infinite}
.hh-glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(181,140,199,.5),rgba(216,116,171,.28) 45%,transparent 70%);animation:beat 1.5s ease-in-out infinite}
.hh-ring{position:absolute;width:74%;height:74%;border-radius:50%;border:2px solid rgba(181,140,199,.5);animation:ripple 1.8s ease-out infinite}
@keyframes ripple{0%{transform:scale(.75);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.17)}28%{transform:scale(.97)}42%{transform:scale(1.08)}56%{transform:scale(1)}}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto 18px;color:var(--gold)}
.divider span{height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider span:last-child{transform:scaleX(-1)}
.ribbon{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px;padding:12px 8px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.62),var(--tint));border:1px solid rgba(255,255,255,.75)}
.chip{position:relative;flex:1 1 62px;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px}
.chip + .chip::before{content:'';position:absolute;left:-2px;top:18%;height:64%;width:1px;background:rgba(133,90,169,.2)}
.chip-ico{color:var(--lilac);opacity:.85}
.chip-num{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.7rem;line-height:1.1;color:var(--ink)}
.chip-lbl{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.is-seconds .chip-num{color:var(--rose-deep)}
.names{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--lilac-deep)}
.names svg{fill:var(--rose)}
.footer{margin-top:2px;font-family:'Great Vibes',cursive;font-size:1.8rem;color:var(--rose)}
</style>
</head>
<body>
<div class="petals" aria-hidden="true">
  <svg class="petal p0" width="18" height="18" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
  <svg class="petal p1" width="18" height="18" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
  <svg class="petal p2" width="18" height="18" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
  <svg class="petal p3" width="18" height="18" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
  <svg class="petal p4" width="18" height="18" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
  <svg class="petal p5" width="18" height="18" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
  <svg class="petal p6" width="18" height="18" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
</div>

<section class="card">
  <p class="kicker">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    <span>30 · 08 · 2025</span>

    </span>

    <span></span>
  </div>

  <ul class="ribbon">
    <li class="chip"><svg class="chip-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M7 14h10"/></svg><span class="chip-num">04</span><span class="chip-lbl">semanas</span></li>
    <li class="chip"><svg class="chip-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="chip-num">01</span><span class="chip-lbl">días</span></li>
    <li class="chip"><svg class="chip-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="chip-num">21</span><span class="chip-lbl">horas</span></li>
    <li class="chip"><svg class="chip-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></svg><span class="chip-num">37</span><span class="chip-lbl">minutos</span></li>
